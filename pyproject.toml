[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quorport"
version = "0.8.0"
description = "Quorport – secure REST endpoints and data loads over SQL databases, files, upstream APIs and Python callables"
authors = [{ name = "Sukarna Chinchod" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<0.142",      # 0.142+ adds a hard dependency on opentelemetry-api
  "uvicorn>=0.29",
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "pyjwt>=2.8",
  "cryptography>=42",
  "ldap3>=2.9",                 # Active Directory group loads (pure Python)
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
mssql = ["pyodbc>=5"]
oracle = ["oracledb>=2.0"]
keyring = ["keyring>=25"]   # Windows Credential Manager / macOS Keychain
gui = ["flet==1.0.4", "flet-desktop==1.0.4", "flet-web==1.0.4"]   # quorport studio
reports = ["jinja2>=3.1", "weasyprint>=62"]   # HTML/PDF report generation
dev = ["pytest>=8"]

[project.scripts]
quorport = "quorport.cli:app"
qp = "quorport.cli:app"
portwright = "quorport.cli:app"         # earlier names, kept so existing scripts and scheduler jobs keep working
pw = "quorport.cli:app"
restforge = "quorport.cli:app"

[tool.setuptools.packages.find]
include = ["quorport*", "portwright", "restforge"]

[tool.setuptools.package-data]
quorport = ["static/swagger/*", "docs/*.md", "reports/templates/*.html"]
